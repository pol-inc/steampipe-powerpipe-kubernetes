apiVersion: v1
kind: Secret
metadata:
  name: {{ include "steampipe.fullname" . }}-secret-env-vars
  labels:
    {{- include "steampipe.labels" . | nindent 4 }}
stringData:
  {{- if not (include "steampipe.existingSecretName" .) }}
  STEAMPIPE_DATABASE_PASSWORD: {{ include "steampipe.databasePassword" . | quote }}
  PGPASSWORD: {{ include "steampipe.databasePassword" . | quote }}
  {{- end }}
  PGDATABASE: "steampipe"
  PGHOST: "0.0.0.0"
  PGUSER: "steampipe"
  PGPORT: "9193"
