apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "powerpipe.fullname" . }}
  labels:
    {{- include "powerpipe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.powerpipe.replicaCount }}
  selector:
    matchLabels:
      {{- include "powerpipe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.powerpipe.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "powerpipe.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.powerpipe.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "powerpipe.serviceAccountName" . }}
      automountServiceAccountToken: {{ if hasKey .Values.powerpipe "automountServiceAccountToken" }}{{ .Values.powerpipe.automountServiceAccountToken }}{{ else }}true{{ end }}
      securityContext:
        {{- toYaml .Values.powerpipe.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "powerpipe.fullname" . }}
          securityContext:
            {{- toYaml .Values.powerpipe.securityContext | nindent 12 }}
          image: "{{ .Values.powerpipe.image.repository }}:{{ .Values.powerpipe.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.powerpipe.image.pullPolicy }}
          envFrom:
          - configMapRef:
              name: {{ include "powerpipe.fullname" . }}-cm-env-vars
          - secretRef:
              name: {{ include "powerpipe.fullname" . }}-secret-env-vars
          {{- with include "steampipe.existingSecretName" . }}
          env:
            - name: STEAMPIPE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ include "steampipe.existingSecretKey" $ }}
            # Kubernetes expands $(STEAMPIPE_DATABASE_PASSWORD) from the entry above.
            - name: POWERPIPE_DATABASE
              value: "postgres://steampipe:$(STEAMPIPE_DATABASE_PASSWORD)@{{ include "steampipe.fullname" $ }}:9193/steampipe"
          {{- end }}
          {{- with .Values.powerpipe.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.powerpipe.containerPort }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - bash
              - ./healthcheck.sh
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- if .Values.powerpipe.resources }}
          resources:
            {{- toYaml .Values.powerpipe.resources | nindent 12 }}
          {{- else }}
          resources: {}
          {{- end }}
      {{- with .Values.powerpipe.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.powerpipe.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.powerpipe.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.powerpipe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
