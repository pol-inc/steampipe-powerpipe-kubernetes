{{- $data := dict }}
{{- if not (include "steampipe.existingSecretName" .) }}
{{- $_ := set $data "POWERPIPE_DATABASE" (printf "postgres://steampipe:%s@%s:9193/steampipe" (include "steampipe.databasePassword" .) (include "steampipe.fullname" .)) }}
{{- end }}
{{- with .Values.powerpipe.secretEnvVars }}
{{- $data = merge $data . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerpipe.fullname" . }}-secret-env-vars
  labels:
    {{- include "powerpipe.labels" . | nindent 4 }}
{{- if $data }}
stringData:
  {{- toYaml $data | nindent 2 }}
{{- else }}
stringData: {}
{{- end }}
